# Builds windows/build/Install-Oni.bat on every push and pull request. Pushing a tag v<VERSION>
# (for example v0.2.0) also publishes a GitHub release with Install-Oni.bat attached.
name: build
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install mono's mcs
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-devel
      - run: bash windows/build-bat.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Install-Oni
          path: windows/build/Install-Oni.bat
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "${GITHUB_REF_NAME#v}" = "$(cat VERSION)" ] || { echo "tag $GITHUB_REF_NAME doesn't match VERSION $(cat VERSION)"; exit 1; }
          gh release create "$GITHUB_REF_NAME" windows/build/Install-Oni.bat --title "Oni installer $(cat VERSION)" --generate-notes
